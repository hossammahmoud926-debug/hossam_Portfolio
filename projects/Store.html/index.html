 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 28px;
        }

        .cart-btn {
            background: #3b82f6;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 20px;
        }

        .product {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #22c55e;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-btn {
            background: #22c55e;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            width: 100%;
        }

        .add-btn:hover {
            background: #16a34a;
        }

        .cart {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .cart h2 {
            margin-bottom: 15px;
        }

        .cart-items p {
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .back-btn:hover {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <header>

        <h1>🛒 Mini Store</h1>

        <div class="cart-btn">
            Cart:
            <span id="cart-count">0</span>
            |
            $
            <span id="cart-total">0</span>
        </div>

    </header>


    <div class="products">

        <!-- Product 1 -->

        <div class="product">

            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
                alt="Running Shoes"
            >

            <h3>Running Shoes</h3>

            <div class="price">
                $59
            </div>

            <button
                class="add-btn"
                onclick="addToCart('Running Shoes', 59)"
            >
                Add to Cart
            </button>

        </div>


        <!-- Product 2 -->

        <div class="product">

            <img
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
                alt="Wireless Headphones"
            >

            <h3>Wireless Headphones</h3>

            <div class="price">
                $120
            </div>

            <button
                class="add-btn"
                onclick="addToCart('Wireless Headphones', 120)"
            >
                Add to Cart
            </button>

        </div>


        <!-- Product 3 -->

        <div class="product">
 <img
                src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
                alt="Smart Watch"
            >

            <h3>Smart Watch</h3>

            <div class="price">
                $199
            </div>

            <button
                class="add-btn"
                onclick="addToCart('Smart Watch', 199)"
            >
                Add to Cart
            </button>

        </div>


        <!-- Product 4 -->

        <div class="product">

            <img
                src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400"
                alt="Classic Watch"
            >

            <h3>Classic Watch</h3>

            <div class="price">
                $85
            </div>

            <button
                class="add-btn"
                onclick="addToCart('Classic Watch', 85)"
            >
                Add to Cart
            </button>

        </div>

    </div>


    <!-- Cart -->

    <div class="cart">

        <h2>Your Cart</h2>

        <div id="cart-items">
            Cart is empty
        </div>

    </div>


    <!-- Back -->

    <a
        href="../projects.html"
        class="back-btn"
    >
        ← Back to Projects
    </a>


    <script>

        let cart = [];
        let total = 0;


        function addToCart(name, price) {

            cart.push({
                name: name,
                price: price
            });

            total += price;

            updateCart();
        }


        function updateCart() {

            document.getElementById("cart-count").innerText =
                cart.length;

            document.getElementById("cart-total").innerText =
                total;


            let cartItems =
                document.getElementById("cart-items");


            if (cart.length === 0) {

                cartItems.innerHTML =
                    "Cart is empty";

            } else {

                cartItems.innerHTML =
                    cart.map(item => {

                        return 
                            <p>
                                ${item.name} - $${item.price}
                            </p>
                        ;

                    }).join("");

            }

        }

    </script>

</body>
</html>
