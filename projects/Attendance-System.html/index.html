<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحضور</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
    body { background: #0a0a0a; color: white; padding: 40px; }
    
    header { text-align: center; margin-bottom: 40px; }
    header h1 { color: #FFD700; font-size: 40px; }
    
    .form-box, .list-box {
        background: #1a1a1a; padding: 30px; border-radius: 15px;
        border: 1px solid #333; margin-bottom: 30px;
    }
    
    input, button {
        width: 100%; padding: 15px; margin-top: 10px;
        background: #222; border: 1px solid #444; color: white;
        border-radius: 8px; font-size: 16px;
    }
    button {
        background: #FFD700; color: black; font-weight: bold;
        cursor: pointer; margin-top: 20px;
    }
    button:hover { opacity: 0.9; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 15px; text-align: center; border-bottom: 1px solid #333; }
    th { color: #FFD700; }
    .present { color: #4CAF50; font-weight: bold; }
    .absent { color: #f44336; font-weight: bold; }
    
    .back-btn {
        display: block; width: 200px; margin: 40px auto 0; padding: 15px;
        background: #333; color: white; text-align: center;
        text-decoration: none; border-radius: 10px;
    }
</style>
</head>
<body>

<header>
    <h1>نظام الحضور الرقمي</h1>
    <p>سجل حضور الموظفين بسهولة</p>
</header>

<div class="form-box">
    <h2>تسجيل موظف جديد</h2>
    <input type="text" id="empName" placeholder="اكتب اسم الموظف">
    <button onclick="addEmployee()">اضافة</button>
</div>

<div class="list-box">
    <h2>قائمة الحضور اليوم</h2>
    <table id="attendanceTable">
        <thead>
            <tr>
                <th>الاسم</th>
                <th>الحالة</th>
                <th>الوقت</th>
            </tr>
        </thead>
        <tbody>
            <!-- البيانات هتظهر هنا -->
        </tbody>
    </table>
</div>

<a href="index.html" class="back-btn">← العودة للمشاريع</a>

<script>
    let employees = [];

    function addEmployee() {
        let name = document.getElementById('empName').value;
        if(name === '') return alert('اكتب الاسم');
        
        let time = new Date().toLocaleTimeString('ar-EG');
        employees.push({name: name, status: 'حاضر', time: time});
        
        document.getElementById('empName').value = '';
        showTable();
    }

    function showTable() {
        let tbody = document.querySelector('#attendanceTable tbody');
        tbody.innerHTML = '';
        employees.forEach(emp => {
            tbody.innerHTML += 
                <tr>
                    <td>${emp.name}</td>
                    <td class="present">${emp.status}</td>
                    <td>${emp.time}</td>
                </tr>
            ;
        });
    }
</script>

</body>
</html>
